services:
  mysql:
    image: mysql:8.4
    container_name: shengyu-mysql
    environment:
      MYSQL_DATABASE: shengyu
      MYSQL_USER: shengyu
      MYSQL_PASSWORD: shengyu_dev
      MYSQL_ROOT_PASSWORD: shengyu_root_dev
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - shengyu_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.4-alpine
    container_name: shengyu-redis
    ports:
      - "6379:6379"
    volumes:
      - shengyu_redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: shengyu-minio
    environment:
      MINIO_ROOT_USER: shengyu
      MINIO_ROOT_PASSWORD: shengyu_dev_password
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - shengyu_minio:/data
  api:
    profiles: ["full"]
    build: ./code
    container_name: shengyu-api
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/shengyu?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai"
      DB_USER: shengyu
      DB_PASSWORD: shengyu_dev
      REDIS_HOST: redis
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: shengyu
      MINIO_SECRET_KEY: shengyu_dev_password
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      IMPORT_LOCAL_MUSIC: ${IMPORT_LOCAL_MUSIC:-false}
      MUSIC_DIR: /data/music
      IMAGE_DIR: /data/img
      MUSIC_EXPERIMENT_DATASET_PATH: /data/experiment/hetrec2011-lastfm-2k.zip
      MUSIC_GENRE_CATALOG_PATH: /data/experiment/song-genres.json
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "8080:8080"
    volumes:
      - ./music:/data/music:ro
      - ./img:/data/img:ro
      - ./data:/data/experiment:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
volumes:
  shengyu_mysql:
  shengyu_redis:
  shengyu_minio:
