server:
  port: ${SERVER_PORT:8080}
spring:
  # MySQL 的 shengyu 库保存用户、曲库、歌单、评论、播放记录和推荐等持久业务数据。
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/shengyu?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:shengyu}
    password: ${DB_PASSWORD:shengyu_dev}
  flyway:
    # 首次启动及后续升级时，按 db/migration 中的 SQL 版本维护 MySQL 表结构。
    enabled: true
  data:
    redis:
      # Redis 保存登录令牌、热门曲库缓存及短期去重/限流状态。
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB
  task:
    scheduling:
      pool:
        size: 2
mybatis-plus:
  configuration:
    call-setters-on-nulls: true
music:
  genre-catalog-path: ${MUSIC_GENRE_CATALOG_PATH:../data/song-genres.json}
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
  storage:
    # MinIO 私有桶保存音频、试听片段与封面；MySQL songs 表只记录对象键。
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:shengyu}
    secret-key: ${MINIO_SECRET_KEY:shengyu_dev_password}
    bucket: ${MINIO_BUCKET:shengyu-media}
  import:
    enabled: ${IMPORT_LOCAL_MUSIC:false}
    music-dir: ${MUSIC_DIR:../music}
    image-dir: ${IMAGE_DIR:../img}
  deepseek:
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-flash}
    api-key: ${DEEPSEEK_API_KEY:}
  preview:
    ffmpeg: ${FFMPEG_BIN:ffmpeg}
    seconds: 30
  experiment:
    dataset-path: ${MUSIC_EXPERIMENT_DATASET_PATH:../data/hetrec2011-lastfm-2k.zip}
